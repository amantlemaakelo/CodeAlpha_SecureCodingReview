<!doctype html>
<title>VitaBank — Dashboard</title>
<!-- Jinja2 autoescapes {{ user.username }} by default, closing the
     reflected-XSS vector present in the audit-target version. -->
<h1>Welcome, {{ user['username'] }}!</h1>
<p>Balance: ${{ "%.2f"|format(user['balance']) }}</p>

<form method="post" action="/transfer">
  {{ csrf_token() if csrf_token is defined else "" }}
  Transfer to: <input name="to_username"><br>
  Amount: <input name="amount" type="number" step="0.01"><br>
  <input type="submit" value="Transfer">
</form>
